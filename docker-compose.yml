version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: moxie_seo_db
    restart: always
    environment:
      POSTGRES_USER: moxie_user
      POSTGRES_PASSWORD: moxie_password
      POSTGRES_DB: moxie_seo_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: